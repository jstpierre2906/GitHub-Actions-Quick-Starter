name: Caller workflow
on:
  push:
    branches:
      - main

jobs:
  SetFormattedJSON:
    uses: ./.github/workflows/callee.yml
    with:
      foo: bar

  PrintFormattedJSON:
    runs-on: ubuntu-latest
    needs: [SetFormattedJSON]
    steps:
      - name: Print formatted JSON
        id: printFormattedJSON
        run: |
          echo "JSON Value formatted by called workflow: ${{ needs.SetFormattedJSON.outputs.formattedJSON }}"
